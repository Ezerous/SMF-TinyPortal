name: Create release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' package-info.xml | head -n 1)"
          smf1_version="$(awk '/<version>/{getline; gsub(/[[:space:]]/, ""); print; exit}' SMF1/tinyportal1090.mod)"
          smf2_version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' SMF2/install.xml | head -n 1)"
          release_version="$(tr -d '[:space:]' < release-version.txt)"

          if [[ -z "$package_version" || "$package_version" != "$smf1_version" || "$package_version" != "$smf2_version" ]]; then
            echo "package-info.xml, SMF1/tinyportal1090.mod, and SMF2/install.xml must contain the same version."
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Package version '$package_version' is not a numeric dotted version."
            exit 1
          fi

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version '$release_version' is not semantic versioning."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            previous_release_version="$(git show HEAD^:release-version.txt 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$release_version" == "$previous_release_version" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Release version was not bumped; skipping release."
              exit 0
            fi
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build package archive
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="SMF-TinyPortal_v${{ steps.version.outputs.release_version }}.zip"
          staging="package-staging"

          rm -rf "$staging"
          mkdir -p "$staging"
          cp installation.txt LICENSE README.md package-info.xml "$staging/"
          cp -R common SMF1 SMF2 "$staging/"

          (
            cd "$staging"
            zip -X -0 -r "../$archive" installation.txt LICENSE README.md package-info.xml common SMF1 SMF2
          )

          expected="$(cd "$staging" && find . -mindepth 1 -printf '%P\n' | sort)"
          actual="$(unzip -Z1 "$archive" | sed 's:/$::' | sort)"

          if [[ "$actual" != "$expected" ]]; then
            echo "The release archive contains an unexpected file list:"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            exit 1
          fi

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.release_version }}"
          archive="SMF-TinyPortal_v${version}.zip"
          gh release create "v${version}" "$archive" \
            --repo "${{ github.repository }}" \
            --title "SMF-TinyPortal v${version}"
