name: Tests

on:
  push:
  pull_request:

jobs:
  validate-package:
    name: PHP 5.3 package validation
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.3'

      - name: Validate package metadata and modifications
        run: php tests/validate-package.php
